<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d9480f">
<title>KAVI Bazaar</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.17.0/dist/ethers.umd.min.js"></script>
<style>
:root{--bg:#f6f4ef;--surface:#fff;--surface-2:#f0ede6;--ink:#1d1b16;--muted:#6b665c;--line:#e2ddd2;--accent:#d9480f;--accent-ink:#fff;--accent-soft:#fff0e6;--ok:#2b8a3e;--ok-soft:#e6f6ea;--warn:#a86a00;--warn-soft:#fff6dd;--err:#c92a2a;--err-soft:#fdecec;--info-soft:#e8f0fe;--r:14px;--nav-h:64px;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.04)}
@media (prefers-color-scheme:dark){:root{--bg:#14130f;--surface:#1d1c18;--surface-2:#272520;--ink:#f1eee6;--muted:#a39d90;--line:#34312b;--accent:#ff7a3d;--accent-ink:#1a0d05;--accent-soft:#3a2316;--ok:#69db7c;--ok-soft:#1c3322;--warn:#ffd43b;--warn-soft:#3a3214;--err:#ff8787;--err-soft:#3b1d1d;--info-soft:#1d2a40;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px)}
h1,h2,h3{line-height:1.25;margin:0 0 .4rem}
h2{font-size:1.15rem}h3{font-size:1rem}
a{color:var(--accent)}
.muted{color:var(--muted)}.small{font-size:.83rem}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.85em;word-break:break-all}
.hidden{display:none!important}
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--ink);text-decoration:none;min-width:0}
.brand-mark{width:34px;height:34px;flex:none;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:.75rem}
.dtabs{display:none;gap:4px;margin-left:8px}
.dtab{border:0;background:none;color:var(--muted);font:inherit;padding:8px 12px;border-radius:9px;cursor:pointer}
.dtab:hover{background:var(--surface-2);color:var(--ink)}
.dtab.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.grow{flex:1}
.wallet{display:flex;gap:6px;align-items:center;flex:none}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;background:var(--surface-2);font-size:.78rem;white-space:nowrap}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.bnav button{flex:1;height:var(--nav-h);border:0;background:none;color:var(--muted);font:inherit;font-size:.72rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;position:relative}
.bnav button svg{width:22px;height:22px}
.bnav button.on{color:var(--accent);font-weight:600}
.badge{position:absolute;top:8px;left:calc(50% + 6px);background:var(--err);color:#fff;border-radius:999px;font-size:.65rem;padding:0 5px;min-width:16px;line-height:16px;text-align:center}
@media (min-width:860px){.dtabs{display:flex}.bnav{display:none}body{padding-bottom:32px}}
main{max-width:1080px;margin:0 auto;padding:16px}
.banner{max-width:1080px;margin:12px auto 0;padding:0 16px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:4px 0 14px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.list{display:grid;gap:12px}
.grid{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:980px){.grid.g3{grid-template-columns:repeat(3,1fr)}}
.stats{display:grid;gap:10px;grid-template-columns:repeat(2,1fr);margin-bottom:14px}
@media (min-width:860px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{padding:12px 14px}
.stat .l{color:var(--muted);font-size:.76rem}
.stat .v{font-size:1.25rem;font-weight:700;margin-top:2px;word-break:break-word}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.sp{margin-top:14px}
label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:4px}
.f{margin-bottom:12px}
.f2{display:grid;gap:10px;grid-template-columns:1fr 1fr}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
textarea{min-height:80px;resize:vertical}
.inline{display:flex;gap:8px}.inline input{flex:1;min-width:0}
.check{display:flex;align-items:center;gap:10px;color:var(--ink);font-size:.92rem;margin-bottom:12px}
.check input{width:20px;height:20px;min-height:0}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;font-size:.9rem;padding:0 16px;min-height:44px;border-radius:10px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.d{color:var(--err);background:var(--err-soft);border-color:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:.82rem}
.btn.full{width:100%}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.acts .btn{flex:1 1 auto}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:.85rem;padding:7px 14px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sname{font-weight:700;font-size:1.05rem;word-break:break-word;cursor:pointer}
.stars{color:#f59f00;letter-spacing:1px}
.rates{list-style:none;margin:12px 0;padding:0;display:grid;gap:6px}
.rates li{background:var(--surface-2);border-radius:10px;padding:9px 12px;font-size:.92rem}
.rates .per{color:var(--muted);font-size:.78rem}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 12px;font-size:.9rem;margin-top:10px}
@media (min-width:640px){.kv.k4{grid-template-columns:repeat(4,1fr)}}
.kv span{display:block;color:var(--muted);font-size:.74rem}
.st{font-weight:600}
.s1{background:var(--warn-soft);color:var(--warn)}.s2{background:var(--err-soft);color:var(--err)}.s3{background:var(--ok-soft);color:var(--ok)}.s4{background:var(--surface-2);color:var(--muted)}
.note{border-radius:10px;padding:10px 12px;font-size:.88rem;background:var(--info-soft);margin-top:10px}
.note.w{background:var(--warn-soft)}.note.e{background:var(--err-soft)}.note.o{background:var(--ok-soft)}
.empty{text-align:center;color:var(--muted);padding:28px 12px}
.loading{color:var(--muted);padding:24px 0;text-align:center}
.hero{text-align:center;padding:48px 8px}
.hero h1{font-size:1.7rem}
.hero p{color:var(--muted);max-width:480px;margin:8px auto 20px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.review{padding:10px 0;border-bottom:1px solid var(--line)}
.review:last-child{border-bottom:0}
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);width:100%;max-width:100%;max-height:92vh;margin:auto auto 0;border-radius:18px 18px 0 0}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{padding:20px 16px calc(16px + env(safe-area-inset-bottom));overflow:auto;max-height:92vh}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:-8px auto 12px}
@media (min-width:640px){dialog{width:min(500px,calc(100vw - 32px));margin:auto;border-radius:16px}.grab{display:none}}
.sheet-acts{display:flex;gap:8px;margin-top:16px}
.sheet-acts .btn{flex:1}
.starpick{display:flex;gap:6px;font-size:2rem}
.starpick button{border:0;background:none;cursor:pointer;color:var(--line);padding:0 2px;font-size:inherit;min-height:44px}
.starpick button.on{color:#f59f00}
#toasts{position:fixed;left:16px;right:16px;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 12px);display:grid;gap:8px;z-index:100;justify-items:center;pointer-events:none}
@media (min-width:860px){#toasts{left:auto;bottom:16px;justify-items:end}}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:.88rem;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:420px;width:100%;word-break:break-word}
.toast.ok{background:var(--ok);color:#fff}.toast.err{background:var(--err);color:#fff}
.more{display:flex;justify-content:center;margin-top:12px}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#"><span class="brand-mark">K</span><span>KAVI Bazaar<small>INR se KAVI kharidein</small></span></a>
    <nav class="dtabs hidden" id="dtabs"></nav>
    <div class="grow"></div>
    <div class="wallet" id="wallet"></div>
  </div>
</header>
<div class="banner" id="banner"></div>
<main>
  <div id="gate">
    <div class="hero">
      <h1>INR do, KAVI lo</h1>
      <p>Verified sellers se UPI ya bank ke through KAVI token kharidein. Tokens contract me lock rehte hain aur payment confirm hote hi aapke wallet me aa jaate hain.</p>
      <button class="btn p" id="heroConnect">Wallet connect karo</button>
    </div>
  </div>
  <section id="v-market" class="hidden"></section>
  <section id="v-orders" class="hidden"></section>
  <section id="v-seller" class="hidden"></section>
  <section id="v-admin" class="hidden"></section>
</main>
<nav class="bnav hidden" id="bnav"></nav>
<dialog id="sheet"><form id="sheetForm" method="dialog"><div class="grab"></div><h3 id="sheetTitle"></h3><div id="sheetBody"></div><div class="sheet-acts"><button class="btn" value="cancel" formnovalidate id="sheetCancel">Band karo</button><button class="btn p" value="ok" id="sheetOk">OK</button></div></form></dialog>
<div id="toasts" aria-live="polite"></div>
<script>
"use strict";
const CONTRACT_ADDRESS = "0x5d1E970a12E0D960302E32c15AcADf880d934CE6";
const SUBGRAPH_URL = "";

const ORDER_T = "tuple(uint256 id,address buyer,address seller,uint256 rateId,uint256 quantity,uint256 inrAmount,uint256 tokenAmount,uint256 feeAmount,uint64 createdAt,uint64 closedAt,uint8 status,bool rated)";
const RATE_T = "tuple(uint256 id,uint256 inrAmount,uint256 tokenAmount,uint256 minQty,uint256 maxQty)";
const SELLER_T = `tuple(address account,bool registered,bool active,bool blocked,string name,string paymentInfo,uint256 availableTokens,uint256 lockedTokens,uint256 avgRatingX100,uint256 ratingCount,uint256 totalSales,uint256 totalTokensSold,uint256 totalInrReceived,uint256 openOrders,uint64 registeredAt,${RATE_T}[] rates)`;
const DISPUTE_T = "tuple(address raisedBy,string reason,uint64 raisedAt,address resolvedBy,bool releasedToBuyer,string note,uint64 resolvedAt,uint64 deadline,bool expired)";
const REVIEW_T = "tuple(uint256 orderId,address buyer,uint8 stars,string comment,uint64 createdAt)";
const STATS_T = "tuple(uint256 totalOrders,uint256 pendingOrders,uint256 disputedOrders,uint256 completedOrders,uint256 cancelledOrders,uint256 totalTokensSold,uint256 totalInrVolume,uint256 totalFeesEarned,address feeWallet,uint256 sellerCount,uint256 arbitratorCount,uint256 feeBps,uint256 contractBalance,uint256 disputeTimeout,bool paused)";

const ABI = [
  "function kaviToken() view returns (address)",
  "function admin() view returns (address)",
  "function feeBps() view returns (uint256)",
  "function paused() view returns (bool)",
  "function ORDER_TIMEOUT() view returns (uint256)",
  "function MAX_FEE_BPS() view returns (uint256)",
  "function MAX_OPEN_ORDERS_PER_BUYER() view returns (uint256)",
  "function MIN_DISPUTE_TIMEOUT() view returns (uint256)",
  "function MAX_DISPUTE_TIMEOUT() view returns (uint256)",
  "function disputeTimeout() view returns (uint256)",
  "function feeWallet() view returns (address)",
  "function isArbitrator(address) view returns (bool)",
  "function buyerOpenOrders(address) view returns (uint256)",
  `function getSeller(address) view returns (${SELLER_T})`,
  `function getSellers(uint256 offset, uint256 limit) view returns (${SELLER_T}[] out, uint256 total)`,
  `function getSellerRates(address) view returns (${RATE_T}[])`,
  `function getSellerReviews(address, uint256 offset, uint256 limit) view returns (${REVIEW_T}[] out, uint256 total)`,
  `function getOrder(uint256) view returns (${ORDER_T})`,
  `function getOrders(uint256 offset, uint256 limit) view returns (${ORDER_T}[] out, uint256 total)`,
  `function getBuyerOrders(address, uint256 offset, uint256 limit) view returns (${ORDER_T}[] out, uint256 total)`,
  `function getSellerOrders(address, uint256 offset, uint256 limit) view returns (${ORDER_T}[] out, uint256 total)`,
  `function getDispute(uint256) view returns (${DISPUTE_T})`,
  `function getOpenDisputes() view returns (${ORDER_T}[] openOrders, ${DISPUTE_T}[] details)`,
  "function getArbitrators() view returns (address[])",
  "function getUserRole(address) view returns (bool isAdminRole, bool isArbitratorRole, bool isSellerRole, uint256 openOrdersAsBuyer)",
  `function getStats() view returns (${STATS_T})`,
  "function quote(address, uint256, uint256) view returns (uint256 inrAmount, uint256 tokenAmount, uint256 feeAmount, bool canFill)",
  "function transferAdmin(address newAdmin)",
  "function setDisputeTimeout(uint256 newTimeout)",
  "function claimExpiredDispute(uint256 orderId)",
  "function setArbitrator(address arbitrator, bool enabled)",
  "function setFeeBps(uint256 newFeeBps)",
  "function setFeeWallet(address newWallet)",
  "function setPaused(bool value)",
  "function setSellerBlocked(address seller, bool blocked)",
  "function registerSeller(string name, string paymentInfo)",
  "function updateSellerProfile(string name, string paymentInfo, bool active)",
  "function depositTokens(uint256 amount)",
  "function withdrawTokens(uint256 amount)",
  "function setRate(uint256 inrAmount, uint256 tokenAmount, uint256 minQty, uint256 maxQty) returns (uint256)",
  "function updateRate(uint256 rateId, uint256 inrAmount, uint256 tokenAmount, uint256 minQty, uint256 maxQty)",
  "function deleteRate(uint256 rateId)",
  "function createOrder(address seller, uint256 rateId, uint256 quantity) returns (uint256)",
  "function confirmPayment(uint256 orderId)",
  "function cancelOrder(uint256 orderId)",
  "function raiseDispute(uint256 orderId, string reason)",
  "function resolveDispute(uint256 orderId, bool releaseToBuyer, string note)",
  "function rateSeller(uint256 orderId, uint8 stars, string comment)",
  "event OrderCreated(uint256 indexed orderId, address indexed buyer, address indexed seller, uint256 rateId, uint256 quantity, uint256 inrAmount, uint256 tokenAmount, uint256 feeAmount)",
];
const PROPOSAL_T = "tuple(uint256 id,uint8 action,address target,uint256 value,bool flag,address proposer,uint64 createdAt,address decidedBy,uint64 decidedAt,uint64 executedAt,uint8 status,string note,string rejectReason)";
const GOV_ABI = [
  "function market() view returns (address)",
  "function admin() view returns (address)",
  "function approver() view returns (address)",
  "function pendingProposals() view returns (uint256)",
  "function approvedProposals() view returns (uint256)",
  "function PROPOSAL_TTL() view returns (uint256)",
  `function getProposal(uint256) view returns (${PROPOSAL_T})`,
  `function getProposals(uint256 offset, uint256 limit) view returns (${PROPOSAL_T}[] out, uint256 total)`,
  "function getRole(address) view returns (bool isAdminRole, bool isApproverRole)",
  "function propose(uint8 action, address target, uint256 value, bool flag, string note) returns (uint256)",
  "function approveProposal(uint256 id)",
  "function rejectProposal(uint256 id, string reason)",
  "function cancelProposal(uint256 id)",
  "function executeProposal(uint256 id)",
  "event ProposalCreated(uint256 indexed id, uint8 action, address target, uint256 value, bool flag, address indexed proposer, string note)",
];
const ACT = { SetFee: 0, SetDisputeTimeout: 1, SetPaused: 2, SetArbitrator: 3, SetSellerBlocked: 4, SetFeeWallet: 5, TransferGovernanceAdmin: 6, SetApprover: 7, TransferMarketAdmin: 8 };
const P_STATUS = ["—", "Approval baaki", "Approved", "Rejected", "Executed", "Cancelled"];
const P_CLASS = ["s4", "s1", "s3", "s2", "s3", "s4"];

const ERC20_ABI = [
  "function decimals() view returns (uint8)",
  "function symbol() view returns (string)",
  "function balanceOf(address) view returns (uint256)",
  "function allowance(address, address) view returns (uint256)",
  "function approve(address, uint256) returns (bool)",
];

const S = { PENDING: 1, DISPUTED: 2, COMPLETED: 3, CANCELLED: 4 };
const STATUS = ["—", "Pending", "Dispute", "Complete", "Cancelled"];
const PAGE = 20;

const ICONS = {
  market: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1.5-5h15L21 9"/><path d="M3 9h18v2a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0z"/><path d="M5 13v7h14v-7"/></svg>',
  orders: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>',
  seller: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
  admin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>',
};
const TABS = [
  { id: "market", label: "Kharido" },
  { id: "orders", label: "Mere Orders" },
  { id: "seller", label: "Seller" },
  { id: "admin", label: "Admin", staffOnly: true },
];

const App = {
  provider: null, signer: null, account: null, chainId: null,
  market: null, marketAddress: null, token: null,
  decimals: 18, symbol: "KAVI", feeBps: 0n, timeout: 3600, maxOpen: 3, disputeTimeout: 604800,
  subgraph: "", sgDown: false, sgLagUntil: 0,
  gov: null, govAdmin: null, approver: null, govPending: 0, govApproved: 0, proposalTtl: 604800, proposals: [], proposalsMore: false,
  role: { admin: false, arb: false, seller: false, openAsBuyer: 0 },
  paused: false, view: "market", adminView: "",
  sellers: [], myOrders: [], myOrdersTotal: 0, adminOrders: [], adminOrdersTotal: 0, disputeCount: 0,
};

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const short = (a) => (a ? a.slice(0, 6) + "…" + a.slice(-4) : "");
const same = (a, b) => !!a && !!b && a.toLowerCase() === b.toLowerCase();
const now = () => Math.floor(Date.now() / 1000);
const sym = () => esc(App.symbol);

function group(i) { try { return BigInt(i).toLocaleString("en-IN"); } catch { return i; } }
function tok(v, dp = 4) {
  const [i, d = ""] = ethers.formatUnits(v, App.decimals).split(".");
  const dd = d.slice(0, dp).replace(/0+$/, "");
  return group(i) + (dd ? "." + dd : "");
}
function inr(p) {
  const [i, d = "0"] = ethers.formatUnits(p, 2).split(".");
  return "₹" + group(i) + (/^0*$/.test(d) ? "" : "." + d.padEnd(2, "0"));
}
const parseTok = (s) => ethers.parseUnits(String(s).trim(), App.decimals);
const parseInr = (s) => ethers.parseUnits(String(s).trim(), 2);
const fee = (t) => (t * App.feeBps) / 10000n;
const feePct = (b = App.feeBps) => (Number(b) / 100).toLocaleString("en-IN", { maximumFractionDigits: 2 }) + "%";
function perToken(i, t) {
  const n = Number(ethers.formatUnits(t, App.decimals));
  if (!n) return "—";
  const p = Number(i) / 100 / n;
  return "₹" + p.toLocaleString("en-IN", { maximumFractionDigits: p < 1 ? 4 : 2 }) + "/" + sym();
}
function priceNum(r) { return Number(r.inrAmount) / 100 / Number(ethers.formatUnits(r.tokenAmount, App.decimals)); }
function stars(avg100, count) {
  count = Number(count);
  if (!count) return '<span class="muted small">Abhi koi rating nahi</span>';
  const a = Number(avg100) / 100, f = Math.round(a);
  return `<span class="stars">${"★".repeat(f)}${"☆".repeat(5 - f)}</span> <b>${a.toFixed(1)}</b> <span class="muted small">(${count})</span>`;
}
const chip = (st) => `<span class="chip st s${st}">${STATUS[st]}</span>`;
const when = (ts) => (Number(ts) ? new Date(Number(ts) * 1000).toLocaleString("en-IN", { dateStyle: "medium", timeStyle: "short" }) : "—");
function dur(s) {
  s = Math.max(0, Math.floor(s));
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
  if (d) return `${d} din ${h}h`;
  if (h) return `${h}h ${m}m`;
  return `${Math.max(1, m)} min`;
}
const qtyText = (r) => `qty ${r.minQty}${r.maxQty > 0n ? "–" + r.maxQty : "+"}`;

function toast(msg, type = "info", el = null, sticky = false) {
  if (!el) {
    el = document.createElement("div");
    $("#toasts").appendChild(el);
    const all = $$("#toasts .toast");
    if (all.length > 2) all.slice(0, all.length - 2).forEach((x) => x.remove());
  }
  el.className = "toast " + type;
  el.textContent = msg;
  clearTimeout(el._t);
  if (!sticky) el._t = setTimeout(() => el.remove(), type === "err" ? 8000 : 4000);
  return el;
}

function sheet({ title, body, ok = "OK", cancel = "Band karo", hideOk = false, onOk, onOpen }) {
  const d = $("#sheet");
  $("#sheetTitle").textContent = title;
  $("#sheetBody").innerHTML = body;
  $("#sheetOk").textContent = ok;
  $("#sheetOk").classList.toggle("hidden", hideOk);
  $("#sheetCancel").textContent = cancel;
  d._onOk = onOk || null;
  d.showModal();
  if (onOpen) onOpen();
}
$("#sheetForm").addEventListener("submit", async (e) => {
  if (e.submitter?.value !== "ok") return;
  e.preventDefault();
  const d = $("#sheet");
  if (!d._onOk) return d.close();
  const b = $("#sheetOk");
  b.disabled = true;
  try { if ((await d._onOk(new FormData($("#sheetForm")))) !== false) d.close(); } finally { b.disabled = false; }
});
$("#sheet").addEventListener("click", (e) => { if (e.target.id === "sheet") $("#sheet").close(); });

function errMsg(e) {
  if (!e) return "Kuch galat ho gaya";
  if (e.code === "ACTION_REJECTED" || e?.info?.error?.code === 4001) return "Aapne wallet me cancel kar diya.";
  if (e.code === "INSUFFICIENT_FUNDS") return "Wallet me gas fee ke liye balance nahi hai.";
  const m = e.reason || e.revert?.args?.[0] || e.info?.error?.data?.message || e.info?.error?.message || e.shortMessage || e.message || String(e);
  if (/missing revert data/i.test(m)) return "Contract ne transaction reject kar diya. Refresh karke dobara check karein.";
  return m.replace(/^execution reverted:?\s*/i, "");
}

async function send(label, fn, ...args) {
  try { await fn.staticCall(...args); } catch (e) { toast(`${label}: ${errMsg(e)}`, "err"); return null; }
  const el = toast(`${label}: wallet me confirm karein…`, "info", null, true);
  try {
    let opts = {};
    try { const est = await fn.estimateGas(...args); opts = { gasLimit: (est * 120n) / 100n + 10000n }; } catch {}
    const t = await fn(...args, opts);
    toast(`${label}: block me jaa raha hai…`, "info", el, true);
    const r = await t.wait();
    if (App.subgraph && !App.sgDown) { toast(`${label}: indexer update ho raha hai…`, "info", el, true); await waitIndexed(r.blockNumber); }
    toast(`${label} ho gaya ✓`, "ok", el);
    return r;
  } catch (e) {
    console.error(e);
    toast(`${label} fail: ${errMsg(e)}`, "err", el);
    return null;
  }
}

function savedContract() { try { return localStorage.getItem("kavi.contract") || CONTRACT_ADDRESS; } catch { return CONTRACT_ADDRESS; } }
function saveContract(a) { try { localStorage.setItem("kavi.contract", a); } catch {} }

class NeedSetup extends Error {}

async function connect(prompt) {
  if (!window.ethereum) throw new Error("Wallet nahi mila. MetaMask ya koi EVM wallet app install karein. Mobile par wallet app ke andar ke browser me ye page kholein.");
  App.provider = new ethers.BrowserProvider(window.ethereum);
  if (prompt) await App.provider.send("eth_requestAccounts", []);
  App.signer = await App.provider.getSigner();
  App.account = await App.signer.getAddress();
  App.chainId = (await App.provider.getNetwork()).chainId;
  const addr = savedContract();
  if (!addr || !ethers.isAddress(addr)) throw new NeedSetup("Contract address set nahi hai.");
  if ((await App.provider.getCode(addr)) === "0x") throw new NeedSetup(`Is network (chain ${App.chainId}) par ${short(addr)} par contract nahi mila. Wallet me sahi network chunein ya address check karein.`);
  App.marketAddress = ethers.getAddress(addr);
  App.market = new ethers.Contract(App.marketAddress, ABI, App.signer);
  App.token = new ethers.Contract(await App.market.kaviToken(), ERC20_ABI, App.signer);
  try { App.decimals = Number(await App.token.decimals()); } catch {}
  try { App.symbol = await App.token.symbol(); } catch {}
  const [t, mo] = await Promise.all([App.market.ORDER_TIMEOUT(), App.market.MAX_OPEN_ORDERS_PER_BUYER()]);
  App.timeout = Number(t);
  App.maxOpen = Number(mo);
  try { App.subgraph = localStorage.getItem("kavi.subgraph") || SUBGRAPH_URL; } catch { App.subgraph = SUBGRAPH_URL; }
  App.gov = null;
  const marketAdmin = await App.market.admin();
  if ((await App.provider.getCode(marketAdmin)) !== "0x") {
    try {
      const g = new ethers.Contract(marketAdmin, GOV_ABI, App.signer);
      if (same(await g.market(), App.marketAddress)) { App.gov = g; App.proposalTtl = Number(await g.PROPOSAL_TTL()); }
    } catch {}
  }
  await refreshRole();
  if (window.ethereum.on && !window.__kl) {
    window.__kl = true;
    window.ethereum.on("accountsChanged", () => location.reload());
    window.ethereum.on("chainChanged", () => location.reload());
  }
}

async function refreshRole() {
  const [r, fb, p, dt] = await Promise.all([App.market.getUserRole(App.account), App.market.feeBps(), App.market.paused(), App.market.disputeTimeout()]);
  App.role = { admin: r[0], arb: r[1], seller: r[2], openAsBuyer: Number(r[3]), approver: false };
  App.feeBps = fb;
  App.paused = p;
  App.disputeTimeout = Number(dt);
  if (App.gov) {
    const [ga, ap, pend, appr] = await Promise.all([App.gov.admin(), App.gov.approver(), App.gov.pendingProposals(), App.gov.approvedProposals()]);
    App.govAdmin = ga;
    App.approver = ap;
    App.govPending = Number(pend);
    App.govApproved = Number(appr);
    App.role.admin = same(App.account, ga);
    App.role.approver = same(App.account, ap);
  }
  if (staff()) {
    try { App.disputeCount = (await App.market.getOpenDisputes())[0].length; } catch {}
  }
  renderChrome();
}

function staff() { return App.role.admin || App.role.arb || App.role.approver; }

function govBadge() {
  if (!App.gov) return 0;
  return (App.role.approver ? App.govPending : 0) + (App.role.admin ? App.govApproved : 0);
}

function adminBadge() { return (App.role.arb ? App.disputeCount : 0) + govBadge(); }

function renderSetup(msg) {
  $("#gate").innerHTML = `
    <div class="card" style="max-width:520px;margin:20px auto">
      <h2>Contract se judiye</h2>
      <p class="muted small">${esc(msg)}</p>
      <div class="f"><label>KaviMarketplace contract address</label><input id="setupAddr" class="mono" placeholder="0x..." value="${esc(savedContract())}" autocapitalize="off" autocomplete="off"></div>
      <button class="btn p full" id="setupSave">Save karke connect karo</button>
    </div>`;
  $("#setupSave").onclick = () => {
    const v = $("#setupAddr").value.trim();
    if (!ethers.isAddress(v)) return toast("Sahi address daalein (0x… 42 characters)", "err");
    saveContract(v);
    start(true);
  };

async function start(prompt) {
  try {
    await connect(prompt);
  } catch (e) {
    renderWallet();
    if (e instanceof NeedSetup) renderSetup(e.message);
    else toast(errMsg(e), "err");
    return;
  }
  $("#gate").classList.add("hidden");
  $("#dtabs").classList.remove("hidden");
  $("#bnav").classList.remove("hidden");
  const h = location.hash.slice(1);
  go(TABS.some((t) => t.id === h) ? h : App.view);
}

function go(v) {
  if (v === "admin" && !staff()) v = "market";
  App.view = v;
  if (location.hash.slice(1) !== v) history.replaceState(null, "", "#" + v);
  ["market", "orders", "seller", "admin"].forEach((x) => $("#v-" + x).classList.toggle("hidden", x !== v));
  renderChrome();
  window.scrollTo(0, 0);
  ({ market: loadMarket, orders: loadOrders, seller: loadSeller, admin: loadAdmin })[v]();
}

async function fetchAllSellers() {
  const out = [];
  let offset = 0, total = 1;
  while (offset < total) {
    const [list, t] = await App.market.getSellers(offset, 100);
    total = Number(t);
    out.push(...list);
    offset += 100;
    if (!list.length) break;
  }
  return out;
}

const SG_ORDER = "orderId buyer seller { id } rateId quantity inrAmount tokenAmount feeAmount statusCode rated createdAt closedAt dispute { raisedBy reason raisedAt deadline resolved resolvedBy releasedToBuyer expired note resolvedAt }";
const SG_STATUS = ["", "Pending", "Disputed", "Completed", "Cancelled"];
const B = (v) => BigInt(v ?? 0);

function sgOn() { return !!App.subgraph && !App.sgDown && now() >= App.sgLagUntil; }

async function gql(query, variables = {}) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), 10000);
  try {
    const res = await fetch(App.subgraph, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ query, variables }), signal: ctl.signal });
    const j = await res.json();
    if (j.errors?.length) throw new Error(j.errors[0].message);
    return j.data;
  } finally { clearTimeout(t); }
}

async function viaIndexer(fromIndexer, fromChain) {
  if (sgOn()) {
    try { return await fromIndexer(); }
    catch (e) { console.warn("Indexer fail, contract se padh rahe hain:", e); App.sgDown = true; renderSource(); }
  }
  return fromChain();
}

function renderSource() {
  const el = $("#srcChip");
  if (!el) return;
  el.textContent = !App.subgraph ? "" : App.sgDown ? "Indexer offline: seedha contract se" : "⚡ Indexer";
  el.classList.toggle("hidden", !App.subgraph);
}

async function waitIndexed(blockNumber) {
  if (!App.subgraph || App.sgDown) return;
  const until = Date.now() + 20000;
  while (Date.now() < until) {
    try {
      const d = await gql("{ _meta { block { number } } }");
      if (d._meta.block.number >= blockNumber) return;
    } catch { break; }
    await new Promise((r) => setTimeout(r, 1200));
  }
  App.sgLagUntil = now() + 30;
}

function sgOrder(o) {
  const d = o.dispute;
  return {
    id: B(o.orderId), buyer: ethers.getAddress(o.buyer), seller: ethers.getAddress(o.seller.id), rateId: B(o.rateId), quantity: B(o.quantity),
    inrAmount: B(o.inrAmount), tokenAmount: B(o.tokenAmount), feeAmount: B(o.feeAmount), createdAt: B(o.createdAt), closedAt: B(o.closedAt),
    status: o.statusCode, rated: o.rated,
    dispute: d ? { raisedBy: d.raisedBy, reason: d.reason, raisedAt: B(d.raisedAt), deadline: B(d.deadline), resolvedBy: d.resolvedBy, releasedToBuyer: d.releasedToBuyer, expired: d.expired, note: d.note, resolvedAt: B(d.resolvedAt) } : null,
  };
}

function sgSeller(s) {
  return {
    account: ethers.getAddress(s.id), registered: true, active: s.active, blocked: s.blocked, name: s.name, paymentInfo: s.paymentInfo,
    availableTokens: B(s.availableTokens), lockedTokens: B(s.lockedTokens), avgRatingX100: B(s.avgRatingX100), ratingCount: B(s.ratingCount),
    totalSales: B(s.totalSales), totalTokensSold: B(s.totalTokensSold), totalInrReceived: B(s.totalInrReceived), openOrders: B(s.openOrders), registeredAt: B(s.registeredAt),
    rates: s.rates.map((r) => ({ id: B(r.rateId), inrAmount: B(r.inrAmount), tokenAmount: B(r.tokenAmount), minQty: B(r.minQty), maxQty: B(r.maxQty) })),
  };
}

async function attachDisputes(list) {
  await Promise.all(list.filter((o) => Number(o.status) === S.DISPUTED || Number(o.status) >= S.COMPLETED).map(async (o) => {
    if (Number(o.status) !== S.DISPUTED) return;
    o.dispute = await App.market.getDispute(o.id);
  }));
  return list;
}

function plainOrder(o) {
  return { id: o.id, buyer: o.buyer, seller: o.seller, rateId: o.rateId, quantity: o.quantity, inrAmount: o.inrAmount, tokenAmount: o.tokenAmount, feeAmount: o.feeAmount, createdAt: o.createdAt, closedAt: o.closedAt, status: Number(o.status), rated: o.rated, dispute: null };
}

const Data = {
  sellers: () => viaIndexer(
    async () => {
      const out = [];
      for (let skip = 0; ; skip += 1000) {
        const d = await gql(`query($skip:Int!){ sellers(first:1000, skip:$skip, orderBy:registeredAt){ id name paymentInfo active blocked availableTokens lockedTokens avgRatingX100 ratingCount totalSales totalTokensSold totalInrReceived openOrders registeredAt rates(where:{active:true}, orderBy:rateId){ rateId inrAmount tokenAmount minQty maxQty } } }`, { skip });
        out.push(...d.sellers.map(sgSeller));
        if (d.sellers.length < 1000) break;
      }
      return out;
    },
    fetchAllSellers
  ),
  ordersOf: (field, addr, offset, limit) => viaIndexer(
    async () => {
      const a = ethers.getAddress(addr).toLowerCase();
      const d = await gql(`query($f:Int!,$s:Int!){ orders(where:{${field}:"${a}"}, orderBy:orderId, orderDirection:desc, first:$f, skip:$s){ ${SG_ORDER} } }`, { f: limit + 1, s: offset });
      return { list: d.orders.slice(0, limit).map(sgOrder), more: d.orders.length > limit };
    },
    async () => {
      const [list, total] = field === "buyer" ? await App.market.getBuyerOrders(addr, offset, limit) : await App.market.getSellerOrders(addr, offset, limit);
      return { list: await attachDisputes(list.map(plainOrder)), more: offset + list.length < Number(total), total: Number(total) };
    }
  ),
  allOrders: (offset, limit, status) => viaIndexer(
    async () => {
      const where = status ? `where:{statusCode:${Number(status)}},` : "";
      const d = await gql(`query($f:Int!,$s:Int!){ orders(${where} orderBy:orderId, orderDirection:desc, first:$f, skip:$s){ ${SG_ORDER} } }`, { f: limit + 1, s: offset });
      return { list: d.orders.slice(0, limit).map(sgOrder), more: d.orders.length > limit };
    },
    async () => {
      const [list, total] = await App.market.getOrders(offset, limit);
      const all = list.map(plainOrder);
      return { list: await attachDisputes(status ? all.filter((o) => o.status === Number(status)) : all), more: offset + list.length < Number(total), total: Number(total), chainPage: list.length };
    }
  ),
  openDisputes: () => viaIndexer(
    async () => {
      const d = await gql(`{ orders(where:{statusCode:2}, orderBy:orderId, orderDirection:asc, first:1000){ ${SG_ORDER} } }`);
      return d.orders.map(sgOrder);
    },
    async () => {
      const [list, det] = await App.market.getOpenDisputes();
      return list.map((o, i) => Object.assign(plainOrder(o), { dispute: det[i] }));
    }
  ),
  reviews: (addr, limit) => viaIndexer(
    async () => {
      const a = ethers.getAddress(addr).toLowerCase();
      const d = await gql(`query($f:Int!){ reviews(where:{seller:"${a}"}, orderBy:createdAt, orderDirection:desc, first:$f){ order { orderId } buyer stars comment createdAt } }`, { f: limit });
      return { list: d.reviews.map((r) => ({ orderId: B(r.order.orderId), buyer: r.buyer, stars: r.stars, comment: r.comment, createdAt: B(r.createdAt) })), total: null };
    },
    async () => {
      const [list, total] = await App.market.getSellerReviews(addr, 0, limit);
      return { list, total: Number(total) };
    }
  ),
};

function disputeInfo(o, viewer) {
  const d = o.dispute;
  if (!d || !Number(d.deadline)) return "";
  const left = Number(d.deadline) - now();
  const who = same(d.raisedBy, o.buyer) ? "Buyer" : "Seller";
  const head = `<b>${who}</b> ne ${when(d.raisedAt)} ko dispute kiya: ${esc(d.reason)}`;
  const timer = left > 0
    ? `Arbitrator ke paas faisle ke liye <b>${dur(left)}</b> baaki hain (${when(d.deadline)} tak). Uske baad faisla na hua to tokens apne aap seller ko wapas ho sakte hain.`
    : `Faisle ka samay khatam ho gaya. Ab koi bhi “Timeout claim” karke tokens seller ko wapas kar sakta hai.`;
  const buyerTip = viewer === "buyer" && left > 0 ? `<br>Arbitrator ko payment ka saboot (UTR/screenshot) jaldi bhejein.` : "";
  return `<div class="note e small">${head}<br>${timer}${buyerTip}</div>`;
}

function canClaim(o) {
  return Number(o.status) === S.DISPUTED && o.dispute && Number(o.dispute.deadline) > 0 && now() >= Number(o.dispute.deadline);
}

function claimSheet(o, after) {

    onOk: async () => { if (!(await send("Timeout claim", App.market.claimExpiredDispute, o.id))) return false; after(); },

function renderMarket() {
  const q = $("#mSearch").value.trim().toLowerCase();
  const sort = $("#mSort").value;
  const list = App.sellers
    .filter((s) => !q || s.name.toLowerCase().includes(q) || s.account.toLowerCase().includes(q))
    .map((s) => ({ s, best: Math.min(...s.rates.map(priceNum)) }))
    .sort((a, b) => (sort === "rating" ? Number(b.s.avgRatingX100 - a.s.avgRatingX100) || Number(b.s.ratingCount - a.s.ratingCount) : sort === "sales" ? Number(b.s.totalSales - a.s.totalSales) : a.best - b.best))
    .map((x) => x.s);
  if (!list.length) {
    $("#mList").innerHTML = `<div class="card empty" style="grid-column:1/-1">Abhi koi seller nahi mila.<br><span class="small">Seller banna hai? Neeche “Seller” tab kholiye.</span></div>`;
    return;
  }
  $("#mList").innerHTML = list.map((s) => {
    const me = same(s.account, App.account);
    return `
      <div class="card">
        <div class="row between" style="align-items:flex-start;flex-wrap:nowrap">
          <div style="min-width:0"><div class="sname" data-info="${esc(s.account)}">${esc(s.name)} ${me ? '<span class="chip">Aap</span>' : ""}</div><div class="mono muted">${short(s.account)}</div></div>
          <span class="chip">${s.totalSales} sales</span>
        </div>
        <div style="margin-top:6px;cursor:pointer" data-info="${esc(s.account)}">${stars(s.avgRatingX100, s.ratingCount)} <span class="small" style="color:var(--accent)">Reviews →</span></div>
        <ul class="rates">${s.rates.map((r) => `<li><b>${inr(r.inrAmount)}</b> → <b>${tok(r.tokenAmount)} ${sym()}</b><div class="per">${perToken(r.inrAmount, r.tokenAmount)} · ${qtyText(r)}</div></li>`).join("")}</ul>
        <div class="row between"><span class="small muted">Stock: ${tok(s.availableTokens)} ${sym()}</span><button class="btn p" data-buy="${esc(s.account)}" ${me || App.paused ? "disabled" : ""}>Kharido</button></div>
      </div>`;
  }).join("");
  $$("[data-buy]").forEach((b) => (b.onclick = () => openBuy(b.dataset.buy)));
  $$("[data-info]").forEach((b) => (b.onclick = () => openSellerInfo(b.dataset.info)));
}

async function openSellerInfo(addr) {
  const s = App.sellers.find((x) => same(x.account, addr)) || (await App.market.getSeller(addr));
  sheet({
    title: s.name,
    hideOk: true,

      <div class="mono muted">${esc(s.account)}</div>
      <div class="kv">

        <div><span>Completed sales</span>${s.totalSales}</div>

      </div>
      <h3 class="sp">Reviews</h3><div id="revList" class="loading">Load ho raha hai…</div>`,
    onOpen: async () => {

        $("#revList").innerHTML = list.length

function openBuy(addr) {
  const s = App.sellers.find((x) => same(x.account, addr));
  if (!s) return;
  if (App.role.openAsBuyer >= App.maxOpen) return toast(`Aapke ${App.maxOpen} orders pehle se open hain. Unhe poora ya cancel karke naya order banayein.`, "err");
  sheet({
    title: `${s.name} se kharidein`,
    ok: "Order banao",
    body: `
      <div class="f"><label>Rate</label><select name="rateId" id="bRate">${s.rates.map((r) => `<option value="${r.id}">${inr(r.inrAmount)} → ${tok(r.tokenAmount)} ${sym()} (${qtyText(r)})</option>`).join("")}</select></div>
      <div class="f"><label>Kitne pack</label><input name="qty" id="bQty" type="number" inputmode="numeric" min="1" step="1" value="1" required></div>
      <div id="bQuote" class="note"></div>
      <p class="small muted">Order banane par seller ke tokens lock ho jaayenge. Uske baad aapko seller ko INR bhejna hai.</p>`,
    onOpen: () => {
      const upd = () => {
        const r = s.rates.find((x) => String(x.id) === $("#bRate").value);
        let q; try { q = BigInt($("#bQty").value || "0"); } catch { q = 0n; }
        const box = $("#bQuote");
        if (q < r.minQty || (r.maxQty > 0n && q > r.maxQty)) { box.className = "note w"; box.textContent = `Quantity ${qtyText(r).replace("qty ", "")} honi chahiye.`; return; }
        const t = r.tokenAmount * q;
        const okStock = s.availableTokens >= t + fee(t);
        box.className = "note " + (okStock ? "o" : "e");
        box.innerHTML = okStock ? `Aapko milenge: <b>${tok(t)} ${sym()}</b><br>Aapko pay karna hai: <b>${inr(r.inrAmount * q)}</b>` : "Seller ke paas itna stock nahi hai. Quantity kam karein.";
      };
      $("#bRate").onchange = upd;
      $("#bQty").oninput = upd;
      upd();
    },
    onOk: async (fd) => {
      const rateId = BigInt(fd.get("rateId"));
      let q; try { q = BigInt(fd.get("qty")); } catch { toast("Quantity sahi daalein", "err"); return false; }
      const qt = await App.market.quote(s.account, rateId, q);
      if (!qt.canFill) { toast("Ye order abhi nahi ban sakta. Quantity ya seller ka stock check karein.", "err"); return false; }
      const rc = await send("Order", App.market.createOrder, s.account, rateId, q);
      if (!rc) return false;
      let id = null;
      for (const l of rc.logs) { try { const p = App.market.interface.parseLog(l); if (p?.name === "OrderCreated") id = p.args.orderId; } catch {} }
      await refreshRole();
      if (id !== null) { const o = await App.market.getOrder(id); setTimeout(() => payInfo(o, s), 60); }
    },
  });
}

function upiLink(info, name, paise, note) {
  const m = String(info || "").match(/[A-Za-z0-9.\-_]{2,}@[A-Za-z]{2,}/);
  if (!m) return null;
  return "upi://pay?" + new URLSearchParams({ pa: m[0], pn: name || "Seller", am: Number(ethers.formatUnits(paise, 2)).toFixed(2), cu: "INR", tn: note }).toString();
}

async function payInfo(o, s) {
  s = s || (await App.market.getSeller(o.seller));
  const link = upiLink(s.paymentInfo, s.name, o.inrAmount, `KAVI Order #${o.id}`);
  sheet({
    title: `Order #${o.id}: payment karein`,
    hideOk: true,
    cancel: "Theek hai",
    body: `
      <div class="note o" style="margin-top:0"><b>${inr(o.inrAmount)}</b> ${esc(s.name)} ko bhejein</div>
      <div class="f sp"><label>Seller payment details</label><div class="card mono" style="padding:12px;white-space:pre-wrap">${esc(s.paymentInfo || "—")}</div></div>
      ${link ? `<a class="btn p full" href="${esc(link)}">UPI app me pay karo</a>` : ""}
      <p class="small">Payment note me <b>KAVI Order #${o.id}</b> likhein. UTR/transaction ID aur screenshot sambhal kar rakhein.</p>
      <div class="note w small">Payment ke baad seller confirm karega aur ${tok(o.tokenAmount)} ${sym()} aapke wallet me aa jaayenge. Seller confirm na kare to <b>Dispute</b> raise karein. Payment ke baad order <b>cancel na karein</b>.</div>`,
  });
}

async function loadOrders(more = false) {
  const v = $("#v-orders");
  if (!more) {
    v.innerHTML = `<div class="head"><div><h2>Mere Orders</h2><div class="small muted" id="oSub"></div></div><button class="btn sm" id="oRefresh">↻ Refresh</button></div><div id="oList" class="list"><div class="loading">Load ho raha hai…</div></div><div class="more" id="oMore"></div>`;
    $("#oRefresh").onclick = () => loadOrders();
    App.myOrders = [];
  }
  try {
    const r = await Data.ordersOf("buyer", App.account, App.myOrders.length, PAGE);
    App.myOrders.push(...r.list);
    App.myOrdersMore = r.more;
    await refreshRole();
    renderOrders();
  } catch (e) {
    $("#oList").innerHTML = `<div class="note e">Orders load nahi hue: ${esc(errMsg(e))}</div>`;
  }
}

async function renderOrders() {
  $("#oSub").textContent = `${App.role.openAsBuyer}/${App.maxOpen} open orders`;
  if (!App.myOrders.length) {
    $("#oList").innerHTML = `<div class="card empty">Aapne abhi tak koi order nahi kiya.<br><button class="btn p sp" onclick="go('market')">Kharidna shuru karo</button></div>`;
    $("#oMore").innerHTML = "";
    return;
  }
  const names = new Map();
  await Promise.all([...new Set(App.myOrders.map((o) => o.seller.toLowerCase()))].map(async (a) => names.set(a, await App.market.getSeller(a))));
  $("#oList").innerHTML = App.myOrders.map((o) => {
    const st = Number(o.status), s = names.get(o.seller.toLowerCase());
    let actions = "", extra = "";
    if (st === S.PENDING) {
      extra = `<div class="note small">${esc(s.name)} ko ${inr(o.inrAmount)} bhejein, phir unke confirm karne ka intezaar karein.</div>`;
      actions = `<button class="btn p sm" data-a="pay" data-id="${o.id}">Payment details</button><button class="btn sm" data-a="dispute" data-id="${o.id}">Dispute</button><button class="btn d sm" data-a="cancel" data-id="${o.id}">Cancel</button>`;
    }
    if (st === S.DISPUTED) {
      extra = disputeInfo(o, "buyer") || `<div class="note e small">Dispute khula hai. Arbitrator jaanch karke faisla karega. Payment ka saboot taiyaar rakhein.</div>`;
      if (canClaim(o)) actions = `<button class="btn sm" data-a="claim" data-id="${o.id}">Timeout claim</button>`;
    }
    if (st === S.COMPLETED) actions = o.rated ? `<span class="small muted">Rating de di ✓</span>` : `<button class="btn p sm" data-a="rate" data-id="${o.id}">★ Rating do</button>`;
    return orderCard(o, { who: "buyer", sellerName: s?.name, actions, extra });
  }).join("");
  $("#oMore").innerHTML = App.myOrdersMore ? `<button class="btn" id="oMoreBtn">Aur dikhao</button>` : "";
  if ($("#oMoreBtn")) $("#oMoreBtn").onclick = () => loadOrders(true);
  $$("#oList [data-a]").forEach((b) => {
    const o = App.myOrders.find((x) => String(x.id) === b.dataset.id);
    b.onclick = () => buyerAct(b.dataset.a, o, names.get(o.seller.toLowerCase()));
  });
}

function buyerAct(a, o, s) {
  if (a === "pay") return payInfo(o, s);
  if (a === "claim") return claimSheet(o, () => loadOrders());
  if (a === "dispute") return disputeSheet(o, () => loadOrders());
  if (a === "cancel") return sheet({
    title: `Order #${o.id} cancel karein?`, ok: "Haan, cancel karo",
    body: `<div class="note w" style="margin-top:0">Agar aap INR bhej chuke hain to cancel <b>na karein</b>, warna tokens seller ko wapas chale jaayenge. Uski jagah Dispute raise karein.</div>`,
    onOk: async () => { if (!(await send("Cancel", App.market.cancelOrder, o.id))) return false; loadOrders(); },
  });
  if (a === "rate") {
    let n = 5;
    return sheet({
      title: `${s?.name || "Seller"} ko rating dein`, ok: "Rating bhejo",
      body: `<div class="starpick" id="sp">${[1, 2, 3, 4, 5].map((i) => `<button type="button" class="on" data-n="${i}" aria-label="${i} star">★</button>`).join("")}</div>
        <div class="f sp"><label>Comment (optional)</label><textarea name="comment" maxlength="280" placeholder="Seller ka experience kaisa raha?"></textarea></div>`,
      onOpen: () => $$("#sp button").forEach((b) => (b.onclick = () => { n = Number(b.dataset.n); $$("#sp button").forEach((x) => x.classList.toggle("on", Number(x.dataset.n) <= n)); })),
      onOk: async (fd) => { if (!(await send("Rating", App.market.rateSeller, o.id, n, String(fd.get("comment") || "")))) return false; loadOrders(); },
    });
  }
}

function disputeSheet(o, after) {
  sheet({
    title: `Order #${o.id}: dispute`, ok: "Dispute raise karo",
    body: `<p class="small muted" style="margin-top:0">Arbitrator aapki baat aur saboot dekhkar faisla karega. Ye reason blockchain par public hota hai, isliye bank details ya personal info na likhein.</p>
      <div class="f"><label>Reason</label><textarea name="reason" required maxlength="280" placeholder="e.g. ₹500 UPI se bheje, UTR 4123…, seller confirm nahi kar raha"></textarea></div>`,
    onOk: async (fd) => { if (!(await send("Dispute", App.market.raiseDispute, o.id, String(fd.get("reason")).trim()))) return false; after(); },
  });
}

async function loadSeller() {
  const v = $("#v-seller");
  v.innerHTML = `<div class="loading">Load ho raha hai…</div>`;
  try {
    await refreshRole();
    const me = await App.market.getSeller(App.account);
    if (!me.registered) return renderRegister(v);
    const [r, wallet] = await Promise.all([Data.ordersOf("seller", App.account, 0, 100), App.token.balanceOf(App.account)]);
    renderSellerDash(v, me, r.list, r.more, wallet);
  } catch (e) {
    v.innerHTML = `<div class="note e">Load nahi hua: ${esc(errMsg(e))}</div>`;
  }
}

  v.innerHTML = `

    </div>
    <div data-p="open" class="list">${open.length ? open.map((o) => sellerOrderCard(o)).join("") : `<div class="card empty">Koi open order nahi.</div>`}</div>
    <div data-p="rates" class="hidden">

  $("#sdRefresh").onclick = loadSeller;

function sellerOrderCard(o) {
  const st = Number(o.status);
  const left = Number(o.createdAt) + App.timeout - now();
  let actions = `<button class="btn ok sm" data-confirm="${o.id}">✓ Payment mila</button>`;
  if (st === S.PENDING) {
    actions += `<button class="btn sm" data-sdispute="${o.id}">Dispute</button>`;
    actions += left > 0 ? `<button class="btn sm" disabled>Cancel (${dur(left)})</button>` : `<button class="btn d sm" data-scancel="${o.id}">Cancel</button>`;
  }
  if (canClaim(o)) actions += `<button class="btn sm" data-sclaim="${o.id}">Timeout claim</button>`;
  const extra = st === S.DISPUTED
    ? `${disputeInfo(o, "seller")}<div class="note small">Payment mila ho to confirm kar dein, warna arbitrator faisla karega.</div>`
    : `<div class="note small">Buyer ko aapko <b>${inr(o.inrAmount)}</b> bhejna hai (note: KAVI Order #${o.id}).</div>`;
  return orderCard(o, { who: "seller", actions, extra });
}

function rateSheet(r) {
  const edit = !!r;
  sheet({
    title: edit ? `Rate #${r.id} edit karein` : "Naya rate", ok: edit ? "Update" : "Save",
    body: `
      <div class="f2"><div class="f"><label>INR (₹)</label><input name="inr" inputmode="decimal" required value="${edit ? ethers.formatUnits(r.inrAmount, 2) : ""}" placeholder="100"></div>
      <div class="f"><label>${sym()} milenge</label><input name="tok" inputmode="decimal" required value="${edit ? ethers.formatUnits(r.tokenAmount, App.decimals) : ""}" placeholder="50"></div></div>
      <div class="f2"><div class="f"><label>Min pack</label><input name="min" type="number" inputmode="numeric" min="1" step="1" value="${edit ? r.minQty : 1}" required></div>
      <div class="f"><label>Max pack (0 = no limit)</label><input name="max" type="number" inputmode="numeric" min="0" step="1" value="${edit ? r.maxQty : 0}" required></div></div>
      <div class="note small" id="rPrev">INR aur tokens daalein.</div>`,
    onOpen: () => {
      const f = $("#sheetForm");
      const upd = () => {
        try {
          const i = parseInr(f.elements.inr.value), t = parseTok(f.elements.tok.value);
          $("#rPrev").textContent = i > 0n && t > 0n ? `1 pack = ${inr(i)} → ${tok(t)} ${App.symbol} (${perToken(i, t)})` : "INR aur tokens 0 se zyada hon.";
        } catch { $("#rPrev").textContent = "Sahi number daalein (INR me max 2 decimal)."; }
      };
      f.elements.inr.oninput = upd;
      f.elements.tok.oninput = upd;
      upd();
    },
    onOk: async (fd) => {
      let i, t, mn, mx;
      try { i = parseInr(fd.get("inr")); t = parseTok(fd.get("tok")); mn = BigInt(fd.get("min")); mx = BigInt(fd.get("max")); } catch { toast("Sahi values daalein", "err"); return false; }
      const ok = edit ? await send("Rate update", App.market.updateRate, r.id, i, t, mn, mx) : await send("Rate set", App.market.setRate, i, t, mn, mx);
      if (!ok) return false;
      loadSeller();
    },
  });
}

function actionText(action, target, value, flag) {
  const a = Number(action);
  const who = (t) => {
    const s = (App.sellers || []).find((x) => same(x.account, t));
    return `${s ? esc(s.name) + " " : ""}<span class="mono">${short(t)}</span>`;
  };
  switch (a) {
    case ACT.SetFee: return `Platform fee <b>${feePct(value)}</b> karo`;
    case ACT.SetDisputeTimeout: return `Dispute time limit <b>${(Number(value) / 86400).toLocaleString("en-IN", { maximumFractionDigits: 2 })} din</b> karo`;
    case ACT.SetPaused: return flag ? "Marketplace <b>band</b> karo (emergency)" : "Marketplace <b>chalu</b> karo";
    case ACT.SetArbitrator: return `${flag ? "Arbitrator <b>add</b> karo" : "Arbitrator <b>hatao</b>"}: ${who(target)}`;
    case ACT.SetSellerBlocked: return `${flag ? "Seller <b>block</b> karo" : "Seller <b>unblock</b> karo"}: ${who(target)}`;
    case ACT.SetFeeWallet: return `Fee wallet badlo → ${who(target)}`;
    case ACT.TransferGovernanceAdmin: return `Admin badlo → ${who(target)}`;
    case ACT.SetApprover: return `Approver badlo → ${who(target)}`;
    case ACT.TransferMarketAdmin: return `Marketplace ka admin contract badlo → ${who(target)}`;
  }
  return "Unknown action";
}

function adminAction(label, action, target, value, flag, directFn, directArgs, after) {
  target = target || ethers.ZeroAddress;
  value = BigInt(value || 0);
  if (!App.gov) {
    return send(label, directFn, ...directArgs).then((r) => { if (r && after) after(); return r; });
  }
  return new Promise((resolve) => sheet({
    title: "Approver ko bhejein",
    ok: "Proposal bhejo",
    body: `<div class="note" style="margin-top:0">${actionText(action, target, value, flag)}</div>
      <p class="small muted">Ye change turant nahi hoga. Approver ke approve karne ke baad aapko “Execute” dabana hoga. Proposal ${Math.round(App.proposalTtl / 86400)} din me expire ho jaata hai.</p>
      <div class="f"><label>Approver ke liye note (optional)</label><textarea name="note" maxlength="280" placeholder="Ye change kyun chahiye?"></textarea></div>`,
    onOk: async (fd) => {
      const r = await send("Proposal", App.gov.propose, action, target, value, flag, String(fd.get("note") || "").trim());
      if (!r) return false;
      resolve(r);
      await refreshRole();
      App.adminView = "approvals";
      setTimeout(loadAdmin, 50);
    },
  }));
}

async function adminApprovals(more = false) {
  if (!more) { App.proposals = []; }
  const [list, total] = await App.gov.getProposals(App.proposals.length, PAGE);
  App.proposals.push(...list);
  App.proposalsMore = App.proposals.length < Number(total);
  if (!App.sellers.length) { try { App.sellers = await Data.sellers(); } catch {} }
  const t = now();
  const expired = (p) => t > Number(p.createdAt) + App.proposalTtl;
  const open = (p) => Number(p.status) === 1 || Number(p.status) === 2;
  const card = (p) => {
    const st = Number(p.status), exp = open(p) && expired(p);
    const left = Number(p.createdAt) + App.proposalTtl - t;
    let acts = "";
    if (App.role.approver && st === 1 && !exp) acts += `<button class="btn ok sm" data-pa="approve" data-id="${p.id}">✓ Approve</button>`;
    if (App.role.approver && (st === 1 || st === 2)) acts += `<button class="btn d sm" data-pa="reject" data-id="${p.id}">${st === 2 ? "Approval wapas lo" : "Reject"}</button>`;
    if (App.role.admin && st === 2 && !exp && same(p.proposer, App.account)) acts += `<button class="btn p sm" data-pa="execute" data-id="${p.id}">Execute karo</button>`;
    if (App.role.admin && (st === 1 || st === 2) && same(p.proposer, App.account)) acts += `<button class="btn sm" data-pa="cancel" data-id="${p.id}">Cancel</button>`;
    const chipTxt = exp ? "Expired" : P_STATUS[st];
    const chipCls = exp ? "s4" : P_CLASS[st];
    let info = "";
    if (st === 1 && !exp) info = `<div class="note w small">Approver ke faisle ka intezaar · ${dur(left)} me expire</div>`;
    if (st === 2 && !exp) info = `<div class="note o small">Approve ho gaya ${when(p.decidedAt)} ko. Ab admin execute kar sakta hai · ${dur(left)} me expire</div>`;
    if (st === 3) info = `<div class="note e small">Reject ${when(p.decidedAt)}${p.rejectReason ? ": " + esc(p.rejectReason) : ""}</div>`;
    if (st === 4) info = `<div class="note o small">Lagu ho gaya ${when(p.executedAt)}</div>`;
    if (exp) info = `<div class="note small">Expire ho gaya. Zarurat ho to naya proposal banayein.</div>`;
    return `<div class="card">
      <div class="row between" style="flex-wrap:nowrap;align-items:flex-start"><div><div class="small muted">Proposal #${p.id} · ${when(p.createdAt)}</div><div style="margin-top:2px">${actionText(p.action, p.target, p.value, p.flag)}</div></div><span class="chip st ${chipCls}">${chipTxt}</span></div>
      ${p.note ? `<div class="small" style="margin-top:8px"><span class="muted">Note:</span> ${esc(p.note)}</div>` : ""}
      ${info}
      ${acts ? `<div class="acts">${acts}</div>` : ""}
    </div>`;
  };
  const pending = App.proposals.filter((p) => open(p) && !expired(p));
  const rest = App.proposals.filter((p) => !(open(p) && !expired(p)));
  $("#aBody").innerHTML = `
    <div class="note" style="margin:0 0 12px">${App.role.approver ? "Aap <b>approver</b> hain. Admin ke har change ko yahan approve ya reject karein." : "Har admin change pehle approver ke paas jaata hai. Approve hone ke baad hi aap use execute kar sakte hain."}
      <div class="small muted" style="margin-top:4px">Admin: <span class="mono">${short(App.govAdmin)}</span> · Approver: <span class="mono">${short(App.approver)}</span></div></div>
    <h3>Open</h3><div class="list">${pending.length ? pending.map(card).join("") : `<div class="card empty">Koi open proposal nahi.</div>`}</div>
    <h3 class="sp">History</h3><div class="list">${rest.length ? rest.map(card).join("") : `<div class="card empty small">Abhi kuch nahi.</div>`}</div>
    <div class="more">${App.proposalsMore ? `<button class="btn" id="pMore">Aur dikhao</button>` : ""}</div>`;
  if ($("#pMore")) $("#pMore").onclick = () => adminApprovals(true).catch((e) => toast(errMsg(e), "err"));
  const done = async () => { await refreshRole(); loadAdmin(); };
  $$("[data-pa]").forEach((b) => (b.onclick = () => {
    const p = App.proposals.find((x) => String(x.id) === b.dataset.id);
    const desc = actionText(p.action, p.target, p.value, p.flag);
    const a = b.dataset.pa;
    if (a === "approve") return sheet({ title: `Proposal #${p.id} approve karein?`, ok: "Approve", body: `<div class="note" style="margin-top:0">${desc}</div>${p.note ? `<p class="small"><span class="muted">Admin ka note:</span> ${esc(p.note)}</p>` : ""}<p class="small muted">Approve ke baad admin ise lagu kar payega.</p>`, onOk: async () => { if (!(await send("Approve", App.gov.approveProposal, p.id))) return false; done(); } });
    if (a === "reject") return sheet({ title: `Proposal #${p.id} reject karein?`, ok: "Reject", body: `<div class="note" style="margin-top:0">${desc}</div><div class="f sp"><label>Reason (admin ko dikhega)</label><textarea name="reason" maxlength="280"></textarea></div>`, onOk: async (fd) => { if (!(await send("Reject", App.gov.rejectProposal, p.id, String(fd.get("reason") || "").trim()))) return false; done(); } });
    if (a === "execute") return sheet({ title: `Proposal #${p.id} execute karein?`, ok: "Execute karo", body: `<div class="note o" style="margin-top:0">${desc}</div><p class="small muted">Approver ne approve kar diya hai. Execute karte hi ye change contract par lagu ho jaayega.</p>`, onOk: async () => { if (!(await send("Execute", App.gov.executeProposal, p.id))) return false; done(); } });
    if (a === "cancel") return sheet({ title: `Proposal #${p.id} cancel karein?`, ok: "Cancel karo", body: `<div class="note" style="margin-top:0">${desc}</div>`, onOk: async () => { if (!(await send("Cancel", App.gov.cancelProposal, p.id))) return false; done(); } });
  }));
}

    adminAction("Approver change", ACT.SetApprover, a, 0, false);
  };
  $("#admBtn").onclick = () => {
    const a = $("#newAdmin").value.trim();
    if (!ethers.isAddress(a)) return toast("Sahi address daalein", "err");
    if (same(a, App.account)) return toast("Ye aapka hi address hai", "err");
    if (App.gov) {
      if (same(a, App.approver)) return toast("Admin aur approver alag hone chahiye", "err");
      return adminAction("Admin transfer", ACT.TransferGovernanceAdmin, a, 0, false);
    }
    sheet({
      title: "Admin transfer pakka?", ok: "Haan, transfer karo",
      body: `<div class="note e" style="margin-top:0">Naya admin: <span class="mono">${esc(ethers.getAddress(a))}</span><br>Fee withdraw aur settings ka control is wallet ke paas chala jaayega. Ise sirf naya admin hi wapas kar sakta hai.</div>`,
      onOk: async () => { if (!(await send("Admin transfer", App.market.transferAdmin, a))) return false; setTimeout(() => location.reload(), 800); },
    });
  };
}

async function adminOrders(more = false) {
  const status = $("#aoF") ? Number($("#aoF").value) : 0;
  if (!more) { App.adminOrders = []; App.adminOffset = 0; }
  const r = await Data.allOrders(App.adminOffset, PAGE, status);
  App.adminOrders.push(...r.list);
  App.adminOffset += r.chainPage ?? r.list.length;
  App.adminOrdersMore = r.more;
  if (!more && !$("#aoF")) {
    $("#aBody").innerHTML = `
      <div class="f2" style="margin-bottom:12px">
        <div class="inline"><input id="aoId" type="number" inputmode="numeric" placeholder="Order # dhoondo"><button class="btn" id="aoGo">Go</button></div>
        <select id="aoF"><option value="0">Sab status</option><option value="1">Pending</option><option value="2">Dispute</option><option value="3">Complete</option><option value="4">Cancelled</option></select>
      </div>
      <div id="aoList" class="list"></div><div class="more" id="aoMore"></div>`;
    $("#aoF").onchange = () => { $("#aoList").innerHTML = `<div class="loading">Load ho raha hai…</div>`; adminOrders(false).catch((e) => toast(errMsg(e), "err")); };
    $("#aoGo").onclick = async () => {
      const id = Number($("#aoId").value);
      if (!id) return;
      const o = plainOrder(await App.market.getOrder(id));
      if (!o.status) return toast("Ye order nahi mila", "err");
      const d = await App.market.getDispute(id);
      if (Number(d.raisedAt)) o.dispute = d;
      let res = "";
      if (o.dispute && Number(d.resolvedAt)) res = `<div class="note small">Faisla: ${d.expired ? "Timeout: seller ko refund" : d.releasedToBuyer ? "buyer ko release" : "seller ko refund"}${d.note ? " · " + esc(d.note) : ""} · ${when(d.resolvedAt)}</div>`;
      const info = o.dispute ? (o.status === S.DISPUTED ? disputeInfo(o, "admin") : `<div class="note e small">Dispute reason: ${esc(d.reason)}</div>`) : "";
      sheet({ title: `Order #${id}`, hideOk: true, body: orderCard(o, { who: "seller", extra: `<div class="kv"><div><span>Seller</span><span class="mono" style="display:inline">${short(o.seller)}</span></div><div><span>Rated</span>${o.rated ? "Haan" : "Nahi"}</div></div>${info}${res}` }) });
    };
  }
  renderAdminOrders();
}

function renderAdminOrders() {
  const list = App.adminOrders;
  $("#aoList").innerHTML = list.length ? list.map((o) => orderCard(o, { who: "seller", extra: `<div class="small muted sp">Seller: <span class="mono">${short(o.seller)}</span></div>` })).join("") : `<div class="card empty">Koi order nahi mila.${App.adminOrdersMore ? " Aur purane orders me dekhein." : ""}</div>`;
  $("#aoMore").innerHTML = App.adminOrdersMore ? `<button class="btn" id="aoMoreBtn">Aur dikhao</button>` : "";
  if ($("#aoMoreBtn")) $("#aoMoreBtn").onclick = () => adminOrders(true).catch((e) => toast(errMsg(e), "err"));
}

async function adminSellers() {
  const list = await Data.sellers();
  if (!list.length) { $("#aBody").innerHTML = `<div class="card empty">Abhi koi seller registered nahi.</div>`; return; }
  const sorted = [...list].sort((a, b) => Number(b.totalSales - a.totalSales));
  $("#aBody").innerHTML = `<div class="grid">${sorted.map((s) => `
    <div class="card">
      <div class="row between" style="flex-wrap:nowrap;align-items:flex-start"><div style="min-width:0"><b>${esc(s.name)}</b><div class="mono muted">${short(s.account)}</div></div>
      ${s.blocked ? '<span class="chip s2">Blocked</span>' : s.active ? '<span class="chip s3">Active</span>' : '<span class="chip s4">Inactive</span>'}</div>
      <div class="kv">
        <div><span>Free</span>${tok(s.availableTokens)}</div><div><span>Locked</span>${tok(s.lockedTokens)}</div>
        <div><span>Rating</span>${stars(s.avgRatingX100, s.ratingCount)}</div><div><span>Sales</span>${s.totalSales} · ${inr(s.totalInrReceived)}</div>
        <div><span>Open orders</span>${s.openOrders}</div><div><span>Payment</span><span class="mono" style="display:inline">${esc(s.paymentInfo || "—")}</span></div>
      </div>
      ${App.role.admin ? `<div class="acts"><button class="btn ${s.blocked ? "ok" : "d"} sm" data-blk="${esc(s.account)}" data-to="${s.blocked ? 0 : 1}">${s.blocked ? "Unblock karo" : "Block karo"}</button></div>` : ""}
    </div>`).join("")}</div>`;
  App.sellers = list;
  $$("[data-blk]").forEach((b) => (b.onclick = () => {
    const block = b.dataset.to === "1";
    if (App.gov) return adminAction(block ? "Block" : "Unblock", ACT.SetSellerBlocked, b.dataset.blk, 0, block);
    sheet({
      title: block ? "Seller block karein?" : "Seller unblock karein?", ok: block ? "Block karo" : "Unblock karo",
      body: `<p style="margin-top:0">${block ? "Is seller par naye orders nahi banenge aur ye marketplace se chhup jaayega. Purane orders aur token withdraw chalte rahenge." : "Seller phir se orders le sakega."}</p>`,
      onOk: async () => { if (!(await send(block ? "Block" : "Unblock", App.market.setSellerBlocked, b.dataset.blk, block))) return false; loadAdmin(); },
    });
  }));
}

document.addEventListener("visibilitychange", () => {
  if (!document.hidden && App.market && App.view === "admin" && App.adminView === "approvals") loadAdmin();
});

renderWallet();
$("#heroConnect").onclick = () => start(true);
(async () => {
  if (!window.ethereum) return;
  try { const a = await window.ethereum.request({ method: "eth_accounts" }); if (a && a.length) start(false); } catch {}
})();
</script>
</body>
</html>
